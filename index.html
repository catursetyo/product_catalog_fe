<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manajemen Produk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      background: #fff;
    }
    a { color: inherit; }

    .container { max-width: 1000px; margin: 40px auto; padding: 0 24px; }

    .panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 24px;
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { margin: 4px 0 0; font-size: 13px; color: #64748b; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0 16px;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 300px;
      max-width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      color: #94a3b8;
      background: #fff;
    }
    .search input {
      border: 0;
      outline: 0;
      flex: 1;
      font: inherit;
      font-size: 13px;
      color: #0f172a;
    }
    .count { font-size: 13px; color: #64748b; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .card {
      border: 1px solid #e5eaf2;
      border-radius: 10px;
      padding: 14px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .card-id { font-size: 11px; color: #94a3b8; }
    .card-name { margin: 4px 0 2px; font-size: 15px; }
    .card-price { margin: 0 0 12px; font-size: 16px; font-weight: 700; color: #1f5fd6; }
    .card-actions { display: flex; gap: 8px; }

    .btn {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary { background: #1f5fd6; color: #fff; }
    .btn-edit { flex: 1; background: #eef4ff; color: #1f5fd6; border-color: #c9dbfb; }
    .btn-del { flex: 1; background: #fdecef; color: #e11d48; border-color: #f8c9d3; }

    .panel-foot { margin: 18px 0 0; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const seed = [
      { id: "ID-1", name: "Pulpen", price: 5000 },
      { id: "ID-2", name: "Buku Tulis", price: 12000 },
      { id: "ID-3", name: "Spidol", price: 8000 },
      { id: "ID-4", name: "Penggaris", price: 6000 },
      { id: "ID-5", name: "Penghapus", price: 3000 },
    ];

    const rupiah = (n) => "Rp" + n.toLocaleString("id-ID");

    function App() {
      const [products] = React.useState(seed);

      return (
        <>
          <main className="container">
            <section className="panel">
              <div className="panel-head">
                <div>
                  <h1>Manajemen Produk</h1>
                  <p className="sub">Kelola daftar produk dan harga dalam satu tempat.</p>
                </div>
                <button className="btn btn-primary">+ Tambah Produk</button>
              </div>

              <div className="toolbar">
                <label className="search">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" strokeWidth="2">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                  </svg>
                  <input placeholder="Cari nama produk..." />
                </label>
                <span className="count">{products.length} produk</span>
              </div>

              <div className="grid">
                {products.map((p) => (
                  <article className="card" key={p.id}>
                    <span className="card-id">{p.id}</span>
                    <h2 className="card-name">{p.name}</h2>
                    <p className="card-price">{rupiah(p.price)}</p>
                    <div className="card-actions">
                      <button className="btn btn-edit">Edit</button>
                      <button className="btn btn-del">Hapus</button>
                    </div>
                  </article>
                ))}
              </div>

              <p className="panel-foot">
                Menampilkan {products.length} dari {products.length} produk
              </p>
            </section>
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
